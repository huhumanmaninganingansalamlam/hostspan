<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">HostSpan app icon</title>
  <desc id="desc">Two local endpoints connected through a central HostSpan gateway.</desc>
  <defs>
    <linearGradient id="background" x1="104" y1="88" x2="920" y2="936" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08111F"/>
      <stop offset="0.55" stop-color="#0B2440"/>
      <stop offset="1" stop-color="#0B3B4B"/>
    </linearGradient>
    <linearGradient id="link" x1="164" y1="512" x2="860" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="server" x1="410" y1="338" x2="632" y2="692" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#DCEBFA"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#020617" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#38BDF8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="224" fill="url(#background)"/>
  <path d="M168 344C274 172 750 172 856 344" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="46" stroke-linecap="round"/>

  <g filter="url(#glow)">
    <path d="M264 512H398" fill="none" stroke="url(#link)" stroke-width="72" stroke-linecap="round"/>
    <path d="M626 512H760" fill="none" stroke="url(#link)" stroke-width="72" stroke-linecap="round"/>

    <circle cx="214" cy="512" r="92" fill="#0A1A2C" stroke="url(#link)" stroke-width="44"/>
    <circle cx="810" cy="512" r="92" fill="#0A1A2C" stroke="url(#link)" stroke-width="44"/>
    <circle cx="214" cy="512" r="24" fill="#E6F7FF"/>
    <circle cx="810" cy="512" r="24" fill="#E6F7FF"/>

    <rect x="366" y="290" width="292" height="444" rx="92" fill="#0A1728" stroke="url(#server)" stroke-width="42"/>

    <g fill="none" stroke-linecap="round">
      <path d="M444 416H580" stroke="url(#link)" stroke-width="42"/>
      <path d="M444 512H580" stroke="url(#link)" stroke-width="42"/>
      <path d="M444 608H580" stroke="url(#link)" stroke-width="42"/>
    </g>
    <g fill="#F8FAFC">
      <circle cx="420" cy="416" r="14"/>
      <circle cx="420" cy="512" r="14"/>
      <circle cx="420" cy="608" r="14"/>
    </g>
  </g>
</svg>
