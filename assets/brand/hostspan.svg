<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">HostSpan MCP gateway icon</title>
  <desc id="desc">Two local endpoints connected through a central protocol gateway and routing graph.</desc>
  <defs>
    <linearGradient id="background" x1="112" y1="96" x2="912" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0A2340"/>
      <stop offset="1" stop-color="#07394A"/>
    </linearGradient>
    <linearGradient id="span" x1="146" y1="512" x2="878" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="hub" x1="354" y1="286" x2="678" y2="748" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFF8FF"/>
      <stop offset="1" stop-color="#BFDDF8"/>
    </linearGradient>
    <filter id="shadow" x="-32%" y="-32%" width="164%" height="164%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#020617" flood-opacity="0.44"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#38BDF8" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="224" fill="url(#background)"/>
  <path d="M176 340C300 190 724 190 848 340" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="44" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <path d="M274 512H350" fill="none" stroke="url(#span)" stroke-width="64" stroke-linecap="round"/>
    <path d="M674 512H750" fill="none" stroke="url(#span)" stroke-width="64" stroke-linecap="round"/>

    <circle cx="208" cy="512" r="88" fill="#091827" stroke="url(#span)" stroke-width="42"/>
    <circle cx="816" cy="512" r="88" fill="#091827" stroke="url(#span)" stroke-width="42"/>
    <circle cx="208" cy="512" r="24" fill="#F3FAFF"/>
    <circle cx="816" cy="512" r="24" fill="#F3FAFF"/>

    <path d="M512 260L682 358V666L512 764L342 666V358Z" fill="#091827" stroke="url(#hub)" stroke-width="42" stroke-linejoin="round"/>

    <g fill="none" stroke="url(#span)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <path d="M512 404L444 594H580Z"/>
    </g>
    <g fill="#F8FCFF" stroke="#0B2037" stroke-width="12">
      <circle cx="512" cy="404" r="32"/>
      <circle cx="444" cy="594" r="32"/>
      <circle cx="580" cy="594" r="32"/>
    </g>
  </g>
</svg>
