# Native execution is not an OS sandbox. This file shows policy intent only.
target_defaults:
  deny_globs:
    - "**/.env*"
    - "**/*.pem"
    - "**/*.key"
    - ".git/objects/**"
  ignore_globs:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/.cache/**"

exec_profile_defaults:
  mode: native
  max_concurrent_processes: 16
