name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-24.04
            arch: x64
          - label: Windows x64
            os: windows-latest
            arch: x64
          - label: macOS Apple Silicon
            os: macos-14
            arch: arm64
          - label: macOS Intel
            os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@22
          cache: true
          install: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify runner architecture
        shell: bash
        run: |
          actual="$(node -p 'process.arch')"
          expected="${{ matrix.arch }}"
          test "$actual" = "$expected" || { echo "Runner architecture $actual does not match expected $expected"; exit 1; }
      - name: Check
        run: pnpm check
      - name: Audit production dependencies
        run: pnpm audit:prod
      - name: Smoke installed CLI package
        run: pnpm package:smoke

  desktop-package-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: core
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@22
          cache: true
          install: false
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Package Linux desktop app
        run: pnpm desktop:make
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke packaged CLI and native SQLite
        run: pnpm desktop:smoke
      - name: Verify artifacts
        run: |
          test -n "$(find out -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find out -maxdepth 1 -type f -name '*.deb' -print -quit)"
          find out -maxdepth 1 -type f -printf '%f\n' | sort
