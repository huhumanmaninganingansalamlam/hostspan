name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-24.04
            arch: x64
          - label: Windows x64
            os: windows-latest
            arch: x64
          - label: macOS Apple Silicon
            os: macos-14
            arch: arm64
          - label: macOS Intel
            os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 12.4.2
          runtime: node@22
          cache: true
          install: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify runner architecture
        shell: bash
        run: |
          actual="$(node -p 'process.arch')"
          expected="${{ matrix.arch }}"
          test "$actual" = "$expected" || { echo "Runner architecture $actual does not match expected $expected"; exit 1; }
      - name: Check
        run: pnpm check
      - name: Audit all dependencies
        run: pnpm audit:all
      - name: Smoke installed CLI package
        if: github.event_name == 'pull_request'
        run: pnpm package:smoke
      - name: Build unpacked desktop runtime
        if: github.event_name == 'pull_request'
        run: pnpm desktop:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke unpacked desktop runtime
        if: github.event_name == 'pull_request'
        run: pnpm desktop:smoke
