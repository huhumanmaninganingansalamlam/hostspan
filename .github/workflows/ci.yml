name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@22
          cache: true
          install: false
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm check
      - name: Audit production dependencies
        run: pnpm audit:prod
      - name: Smoke installed CLI package
        run: pnpm package:smoke

  desktop-package-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@22
          cache: true
          install: false
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Package Linux desktop app
        run: pnpm desktop:make
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke packaged CLI and native SQLite
        run: pnpm desktop:smoke
      - name: Verify artifacts
        run: |
          test -n "$(find out -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find out -maxdepth 1 -type f -name '*.deb' -print -quit)"
          find out -maxdepth 1 -type f -printf '%f\n' | sort
