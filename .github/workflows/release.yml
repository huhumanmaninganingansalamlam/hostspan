name: desktop-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed tag to package and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tagged source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@22
          cache: true
          install: false
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          actual="${{ steps.release.outputs.tag }}"
          test "$actual" = "$expected" || { echo "Tag $actual does not match package version $expected"; exit 1; }
      - name: Check
        run: pnpm check
      - name: Audit production dependencies
        run: pnpm audit:prod
      - name: Smoke installed CLI package
        run: pnpm package:smoke

  build:
    name: ${{ matrix.label }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
            arch: x64
          - label: Windows x64
            os: windows-latest
            artifact: windows-x64
            arch: x64
          - label: macOS Apple Silicon
            os: macos-14
            artifact: macos-arm64
            arch: arm64
          - label: macOS Intel
            os: macos-15-intel
            artifact: macos-x64
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@22
          cache: true
          install: false
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          actual="${{ steps.release.outputs.tag }}"
          test "$actual" = "$expected" || { echo "Tag $actual does not match package version $expected"; exit 1; }
      - name: Verify runner architecture
        shell: bash
        run: |
          actual="$(node -p 'process.arch')"
          expected="${{ matrix.arch }}"
          test "$actual" = "$expected" || { echo "Runner architecture $actual does not match expected $expected"; exit 1; }
      - name: Core gate
        run: pnpm check
      - name: Audit production dependencies
        run: pnpm audit:prod
      - name: Smoke installed CLI package
        run: pnpm package:smoke
      - name: Build desktop artifacts
        run: pnpm desktop:make
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke packaged runtime
        run: node scripts/smoke-packaged-cli.mjs
      - name: Install and smoke Windows NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path out -Filter 'HostSpan-*-win-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer was not produced.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'HostSpanInstalled'
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          $result = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "NSIS installer exited $($result.ExitCode)." }
          if (-not (Test-Path (Join-Path $installDir 'HostSpan.exe'))) { throw 'Installed HostSpan.exe is missing.' }
          node scripts/smoke-packaged-cli.mjs --platform win32 --arch "${{ matrix.arch }}" --installed-dir "$installDir"
      - name: Install and smoke macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg="$(find out -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount="$RUNNER_TEMP/hostspan-dmg"
          installed="$RUNNER_TEMP/HostSpan.app"
          rm -rf "$mount" "$installed"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          test -d "$mount/HostSpan.app"
          cp -R "$mount/HostSpan.app" "$installed"
          hdiutil detach "$mount"
          trap - EXIT
          node scripts/smoke-packaged-cli.mjs --platform darwin --arch "${{ matrix.arch }}" --installed-dir "$installed"
      - name: Upload platform artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hostspan-${{ matrix.artifact }}
          path: |
            out/*.AppImage
            out/*.deb
            out/*.dmg
            out/*.zip
            out/*.exe
          if-no-files-found: error
          retention-days: 14

  package-cli:
    name: Package CLI
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@22
          cache: true
          install: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build CLI
        run: pnpm build
      - name: Pack CLI
        shell: bash
        run: |
          mkdir -p out/cli
          pnpm pack --pack-destination out/cli
      - name: Smoke release CLI tarball
        shell: bash
        run: node scripts/smoke-cli-package.mjs --tarball "$(find out/cli -maxdepth 1 -type f -name '*.tgz' -print -quit)"
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: hostspan-cli
          path: out/cli/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs:
      - build
      - package-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: List release assets
        working-directory: release-assets
        run: ls -lah
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: HostSpan ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.release.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: release-assets/*
