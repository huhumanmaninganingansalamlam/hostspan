name: HostSpan bug report
description: Reproducible HostSpan defect or MCP/ChatGPT compatibility issue
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not post tokens, private keys, screenshots with sensitive data, raw private process output, or unreviewed support bundles.
        Include a sanitized `hostspan support-export` only after reviewing its contents.
  - type: input
    id: version
    attributes:
      label: HostSpan version and build identity (when available)
      description: From hostspan --version --verbose or system_status.
      placeholder: "0.13.2, development build_id: ..."
    validations:
      required: false
  - type: input
    id: toolset
    attributes:
      label: toolset_hash (when available)
      description: From hostspan print-toolset or system_status; useful for client metadata mismatches.
    validations:
      required: false
  - type: input
    id: platform
    attributes:
      label: Operating system and runtime
      placeholder: "Ubuntu 24.04 x64 / Windows 11 x64 / macOS 14 arm64"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed behavior
      description: Include sanitized error code/state, request_id/process_id and whether a side effect may have run.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include command/profile mode and minimal arguments. Never include credentials or private target contents.
    validations:
      required: true
  - type: dropdown
    id: reached
    attributes:
      label: Did the request reach HostSpan?
      options:
        - "Yes - matching request/transport trace exists"
        - "No - no matching HostSpan request trace"
        - "Unknown"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics (optional)
      description: Relevant Doctor checks, redacted trace or logs; an entire Doctor dump is not mandatory.
    validations:
      required: false
